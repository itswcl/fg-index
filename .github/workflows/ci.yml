name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (release poller)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test VM release poller
        run: python -m unittest discover -s ops/release-poller -p 'test_*.py'

      - name: Test offline root release promoter
        run: python -m unittest ops.tests.test_promote_api_release -v

      - name: Test root deployment transactions
        run: python -m unittest ops.tests.test_deploy_api_release -v

      - name: Test reviewed OCI transition
        run: python -m unittest ops.tests.test_transition_oci_deployment -v

      - name: Test deployment systemd contracts
        run: python -m unittest ops.tests.test_deployment_unit_access -v

      - name: Validate deployment units
        run: systemd-analyze verify ops/deployment/systemd/fg-index-deployment.service ops/deployment/systemd/fg-index-deployment.timer

      - name: Test inactive OCI host bootstrap
        run: python -m unittest ops.tests.test_bootstrap_oci_host -v

      - name: Validate API systemd unit
        run: systemd-analyze verify ops/oci/fg-index-api.service

      - name: Validate Caddy log redaction policy
        run: python3 ops/tests/test_caddy_log_redaction.py --static-only

      - name: Test API release publisher safety
        run: python3 -m unittest ops.tests.test_publish_api_release -v

      # ── API Server ───────────────────────────────────────────────────────────
      - name: Setup Node (api-server)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api-server/package-lock.json
            packages/shared-types/package-lock.json

      - name: Install shared-types dependencies
        working-directory: apps/api-server
        run: npm ci --workspaces=false --prefix ../../packages/shared-types

      - name: Install api-server dependencies
        working-directory: apps/api-server
        run: npm ci --workspaces=false

      - name: Build api-server
        working-directory: apps/api-server
        run: npm run build

      - name: Type-check api-server
        working-directory: apps/api-server
        run: npx tsc --noEmit

      - name: Test api-server
        working-directory: apps/api-server
        # Provide dummy env vars so Zod schema passes during test startup.
        env:
          CNN_FEAR_GREED_URL: https://example.com/fear-greed
          GOOGLE_FINANCE_VIX_URL: https://example.com/vix
          YAHOO_FINANCE_VIX_URL: https://example.com/vix-fallback
          GOOGLE_FINANCE_BTC_URL: https://example.com/btc
          YAHOO_FINANCE_BTC_URL: https://example.com/btc-fallback
          GOOGLE_FINANCE_SPX_URL: https://example.com/spx
          YAHOO_FINANCE_SPX_URL: https://example.com/spx-fallback
          SCRAPER_USER_AGENT: test-agent
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DIRECT_URL: postgresql://test:test@localhost:5432/test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_JWKS_URL: https://example.supabase.co/auth/v1/.well-known/jwks.json
          SCHEDULERS_ENABLED: "false"
          NODE_ENV: test
        # Excludes are configured in vitest.config.ts (integration + CNN tests require live network).
        run: npm test

      - name: Assemble production API artifact
        working-directory: .
        run: |
          set -eu

          release_dir="${RUNNER_TEMP}/api-release"
          mkdir -p \
            "${release_dir}/apps/api-server" \
            "${release_dir}/packages/shared-types"

          cp apps/api-server/package.json apps/api-server/package-lock.json "${release_dir}/apps/api-server/"
          cp -R apps/api-server/dist apps/api-server/prisma "${release_dir}/apps/api-server/"
          cp packages/shared-types/package.json packages/shared-types/package-lock.json "${release_dir}/packages/shared-types/"
          cp -R packages/shared-types/dist "${release_dir}/packages/shared-types/"

          npm ci --omit=dev --prefix "${release_dir}/packages/shared-types"
          npm ci --omit=dev --prefix "${release_dir}/apps/api-server"

          # Keep the Prisma client generated by the Linux build in the release.
          mkdir -p "${release_dir}/apps/api-server/node_modules/.prisma"
          cp -R apps/api-server/node_modules/.prisma/client "${release_dir}/apps/api-server/node_modules/.prisma/"

          printf '%s\n' \
            "source_commit=${GITHUB_SHA}" \
            "node_version=$(node --version)" \
            'api_entrypoint=apps/api-server/dist/index.js' \
            'start_command=(cd apps/api-server && npm start)' \
            'shared_types_runtime=packages/shared-types/dist/index.js' \
            'prisma_client=apps/api-server/node_modules/.prisma/client' \
            'scheduler_setting_before_cutover=SCHEDULERS_ENABLED=false' \
            > "${release_dir}/RELEASE-MANIFEST.txt"

          test -f "${release_dir}/apps/api-server/dist/index.js"
          test -f "${release_dir}/packages/shared-types/dist/index.js"
          test -f "${release_dir}/apps/api-server/node_modules/.prisma/client/default.js"
          test -L "${release_dir}/apps/api-server/node_modules/@shared/types"
          (
            cd "${release_dir}/apps/api-server"
            node --check dist/index.js
            node --input-type=module -e 'await import("@shared/types"); await import("@prisma/client")'
          )

          tar -czf "${RUNNER_TEMP}/api-release.tar.gz" -C "${release_dir}" .
          (
            cd "${RUNNER_TEMP}"
            sha256sum api-release.tar.gz > api-release.tar.gz.sha256
            sha256sum -c api-release.tar.gz.sha256
          )

      # Temporary CI artifact only: expires after one day and is not deployment-ready
      # until a release publisher consumes it.
      - name: Upload production API artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api-production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/api-release.tar.gz
            ${{ runner.temp }}/api-release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

      # ── Web App ──────────────────────────────────────────────────────────────
      - name: Setup Node (web)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        # The committed web lockfile is missing five declared production dependencies.
        run: npm install --workspaces=false

      - name: Type-check web
        working-directory: apps/web
        run: npm run lint

      - name: Build web (smoke test)
        working-directory: apps/web
        env:
          VITE_API_URL: https://fg-index.onrender.com
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        # Type-checking already done above; run vite build directly to avoid
        # tsc -b picking up hoisted vite v7 types from api-server.
        run: npx vite build

  attest-api-release:
    name: Attest trusted API release artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download production API artifact
        uses: actions/download-artifact@v5
        with:
          name: api-production-${{ github.sha }}
          path: ${{ runner.temp }}/api-artifact

      - name: Verify archive checksum and source commit
        env:
          SOURCE_SHA: ${{ github.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/api-artifact
        run: |
          set -euo pipefail
          cd "$ARTIFACT_DIR"
          sha256sum -c api-release.tar.gz.sha256
          manifest_source=$(tar -xOf api-release.tar.gz ./RELEASE-MANIFEST.txt | sed -n 's/^source_commit=//p')
          test "$manifest_source" = "$SOURCE_SHA"

      - name: Generate API build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/api-artifact/api-release.tar.gz
