name: Claude PR Review (Manual Trigger)

on:
  issue_comment:
    types: [created] # Triggers whenever a new comment is posted

jobs:
  review:
    # 1. Ensure the comment is on a PR (not a regular issue)
    # 2. Ensure the comment contains the specific trigger phrase
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # Required to add the reaction to your comment

    steps:
      # Optional but recommended: Add a "thumbs up" to your comment so you know it started
      - name: Acknowledge request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

      # CRITICAL: issue_comment checks out the main branch by default.
      # We must explicitly tell it to check out the PR's specific branch.
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review the PR changes for potential bugs, logic regressions, and architectural issues. 
            Provide a detailed comment with actionable findings and code suggestions.
