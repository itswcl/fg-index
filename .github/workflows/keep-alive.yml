name: Keep Alive

# GitHub deprioritizes free-tier scheduled workflows and frequently drops
# triggers — observed gaps of 60–120 min between runs of `*/14`. Since
# Render free tier sleeps after 15 min idle, that wasn't keeping the API
# awake. Strategy:
#   1. Cron more often (`*/5`) so we get more chances to land.
#   2. Inside each run, ping the health endpoint several times spaced 4 min
#      apart, so a single actual execution covers ~16 min of awake time
#      regardless of whether the next scheduled run lands on time.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allow manual trigger for testing

# Cancel an in-flight run if a new one starts so we don't pile them up.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping API Health
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Ping health endpoint repeatedly
        env:
          URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          set -u
          if [ -z "${URL}" ]; then
            echo "::error::KEEP_ALIVE_URL secret is not set"
            exit 1
          fi

          ping_once() {
            local attempt
            for attempt in 1 2 3; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
              echo "Ping #$1 attempt $attempt → HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::warning::Ping #$1 failed after 3 attempts (last status $STATUS)"
            return 1
          }

          # 5 pings spaced 4 min apart = ~16 min of awake coverage per run.
          # Even if the next scheduled trigger gets dropped, Render stays up.
          for i in 1 2 3 4 5; do
            ping_once "$i" || true
            if [ "$i" -lt 5 ]; then
              sleep 240
            fi
          done
